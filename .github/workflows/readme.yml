# Refreshes the build-status tables in README.md and the app's live catalog.json
# (scripts/readme-status.py) after any build workflow finishes, and on demand.
# The Byre app fetches catalog.json from main, so new releases need no app update.
name: README status

on:
  workflow_run:
    workflows: [Postgres, Postgres mirror, Extensions, MySQL, MariaDB, Redis + Valkey, MongoDB Tools, MongoDB mirror]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Both files are generated from the releases, so never merge them:
          # regenerate on the newest main and retry if another push wins the race.
          for _ in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard FETCH_HEAD
            scripts/readme-status.py
            git diff --quiet README.md catalog.json && exit 0
            git commit -qm "Refresh build status and catalog" README.md catalog.json
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
