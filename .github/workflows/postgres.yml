# Builds PostgreSQL from the official source tarball (ftp.postgresql.org) for
# every platform Byre supports and publishes each version as a PRERELEASE
# tagged postgres-<version>, assets postgres-<version>-<triple>.tar.gz + .sha256.
#
# Versions are the catalog's `exact` values (versions.json mirrors
# src-tauri/catalog.json in byreapp/byre). Byre doesn't download these yet; it
# still uses theseus-rs/postgresql-binaries.
#
# Tarball layout (same as theseus): postgres-<version>-<triple>/{bin,lib,share,include}
# Relocatable: rpath @loader_path/../lib (macOS) / $ORIGIN/../lib (Linux), with
# Homebrew/apt libs bundled into lib/ (Windows: vcpkg DLLs next to the .exe).
#
# Run: Actions → Postgres → Run workflow. "all" builds every version not fully
# published yet; a version rebuilds that one (assets are replaced).
name: Postgres

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in versions.json (e.g. 18.6.0), or "all"
        default: all

permissions:
  contents: write

# Build targets. plan.sh drops the ones already published, so a re-run only
# builds what's missing.
# 22.04 = older glibc, so the binaries run on more distros.
env:
  TARGETS: >-
    [
     {"os": "macos-latest", "platform": "macos-arm64", "triple": "aarch64-apple-darwin"},
     {"os": "macos-15-intel", "platform": "macos-x64", "triple": "x86_64-apple-darwin"},
     {"os": "ubuntu-22.04", "platform": "linux-x64", "triple": "x86_64-unknown-linux-gnu"},
     {"os": "ubuntu-22.04-arm", "platform": "linux-arm64", "triple": "aarch64-unknown-linux-gnu"},
     {"os": "windows-latest", "platform": "windows-x64", "triple": "x86_64-pc-windows-msvc"}
    ]

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.p.outputs.builds }}
      versions: ${{ steps.p.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          b=$(scripts/plan.sh postgres "$VERSION" "$TARGETS")
          echo "builds=$b" >> "$GITHUB_OUTPUT"
          echo "versions=$(jq -c '[.[].version] | unique' <<<"$b")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ${{ matrix.target.os }}
    env:
      NAME: postgres-${{ matrix.version }}-${{ matrix.target.triple }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq libicu-dev libssl-dev liblz4-dev zlib1g-dev uuid-dev libedit-dev patchelf pkg-config
      # vcpkg builds icu/openssl from source (~20 min); its binary cache makes reruns fast.
      - uses: actions/cache@v6
        if: runner.os == 'Windows'
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-postgres-v1
      # MSVC dev env (vcvars64) for later steps; replaces ilammy/msvc-dev-cmd,
      # which still runs on Node 20.
      - name: MSVC env
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          set >> "%GITHUB_ENV%"
      - name: Windows deps
        if: runner.os == 'Windows'
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: |
          set -euo pipefail
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          vcpkg="$(cygpath -u "$VCPKG_INSTALLATION_ROOT")"
          # openssl[tools]: the 14/15 perl build runs openssl.exe to detect the version.
          "$vcpkg/vcpkg.exe" install --triplet x64-windows --clean-after-build icu lz4 "openssl[tools]" zlib pkgconf
          echo "VCPKG_INSTALLED=$vcpkg/installed/x64-windows" >> "$GITHUB_ENV"
          python -m pip install -q meson ninja
          choco install winflexbison3 -y --no-progress
      - name: Build
        run: scripts/build-postgres.sh "${{ matrix.version }}" "out/$NAME"
      - name: Package
        run: mkdir -p dist && tar czf "dist/$NAME.tar.gz" -C out "$NAME"
      - name: Smoke test
        run: scripts/test-postgres.sh "dist/$NAME.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: dist/*.tar.gz

  publish:
    needs: [plan, build]
    # Publish whatever built: one platform failing shouldn't hold back the rest
    # (a later "all" run retries the missing ones).
    if: always() && needs.plan.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: postgres-${{ matrix.version }}-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish.sh postgres "${{ matrix.version }}"
