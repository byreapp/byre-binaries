# Daily: opens an issue "Add <engine> <version>" for each upstream release
# versions.json is missing (scripts/check-versions.py). An issue that already
# exists, open or closed, isn't recreated, so closing one dismisses it.
name: Check versions

on:
  schedule:
    - cron: "0 0 * * *" # midnight UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/check-versions.py --self-test
          gh label create new-version --color 0e8a16 --description "Upstream release to add" 2>/dev/null || true
          have=$(gh issue list --label new-version --state all --limit 1000 --json title -q '.[].title')
          python3 scripts/check-versions.py | while read -r engine version kind; do
            title="Add $engine $version"
            grep -qxF "$title" <<<"$have" && continue
            if [ "$kind" = patch ]; then
              body="$engine $version is a new patch release of a line we ship. Replace the older patch of that line in \`versions.json\` (\`$engine.versions\`), then run the $engine workflow (version \`all\`)."
            else
              body="$engine $version starts a release line we don't ship. Check it's GA (not an RC/preview) before adding it to \`versions.json\` (\`$engine.versions\`); close this issue to skip it."
            fi
            gh issue create --title "$title" --label new-version --body "$body"
          done
