# Builds the MongoDB server (mongod + mongos) from the mongodb/mongo r<version>
# tag and publishes it as a PRERELEASE tagged mongodb-<version>, assets
# mongodb-<version>-<triple>.tar.gz + .sha256.
#
# NOT RUN ROUTINELY. A from-source server build is many hours of C++ on the
# standard 4-vCPU/16 GB runner (likely past the 6 h job limit) and needs
# 30+ GB of disk. Run it on a larger runner: pass its label as `runner`
# (e.g. a 16-core ubuntu-22.04 larger runner). Linux x64 only for now; see README.
#
# 7.0 builds with SCons, 8.0+ with Bazel (the repo's own wrappers fetch the
# right toolchain). Byre still downloads the vendor's binaries.
name: MongoDB (manual, large runner)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in versions.json (e.g. 8.0.32)
        required: true
      runner:
        description: Runner label (use a larger runner)
        default: ubuntu-22.04

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      VERSION: ${{ inputs.version }}
      NAME: mongodb-${{ inputs.version }}-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/plan.sh mongodb "$VERSION"
      - name: Free disk + deps
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -q && sudo apt-get install -yq libssl-dev libcurl4-openssl-dev python3-dev python3-venv patchelf
          df -h /
      - name: Build
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "r$VERSION" https://github.com/mongodb/mongo src
          cd src
          python3 -m venv .venv && . .venv/bin/activate
          if [ "${VERSION%%.*}" -lt 8 ]; then
            pip install -q -r etc/pip/compile-requirements.txt
            python3 buildscripts/scons.py install-core --disable-warnings-as-errors \
              MONGO_VERSION="$VERSION" DESTDIR="$PWD/../out/$NAME" -j"$(nproc)"
          else
            python3 buildscripts/install_bazel.py
            export PATH="$HOME/.local/bin:$PATH"
            bazel build install-core --disable_warnings_as_errors=True
            mkdir -p "../out/$NAME" && cp -RL bazel-bin/install/bin "../out/$NAME/"
          fi
          cp LICENSE-Community.txt "../out/$NAME/" || true
          cd .. && scripts/relocate-linux.sh "out/$NAME"
      - name: Package + smoke test
        run: |
          set -euo pipefail
          mkdir -p dist && tar czf "dist/$NAME.tar.gz" -C out "$NAME"
          d=$(mktemp -d) && tar xzf "dist/$NAME.tar.gz" -C "$d"
          "$d/$NAME/bin/mongod" --version
          mkdir "$d/db" && "$d/$NAME/bin/mongod" --dbpath "$d/db" --port 27099 --fork --logpath "$d/log"
          grep -q 'Waiting for connections' "$d/log"
          "$d/$NAME/bin/mongod" --dbpath "$d/db" --shutdown
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish.sh mongodb "$VERSION"
