# Mirrors MongoDB's official Community Server builds (fastdl.mongodb.org) into
# this repo as PRERELEASES tagged mongodb-<version>, assets
# mongodb-<version>-<triple>.tar.gz + .sha256, the same layout as the
# from-source engines. Each download is checked against the SHA-256 in
# MongoDB's full.json, then repackaged as mongodb-<version>-<triple>/{bin,…}.
# Linux is the Ubuntu 22.04 build (glibc 2.35, OpenSSL 3), which also runs on
# newer distros. Not used by Byre yet.
#
# A from-source build doesn't fit the free runners (hours of Bazel, more disk
# than they have), so this mirrors instead. Source: byreapp/mongo (SSPL).
#
# Run: Actions → MongoDB mirror → Run workflow, after adding a version to
# versions.json (`mongodb.versions`). Versions already fully mirrored are skipped.
name: MongoDB mirror

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL https://downloads.mongodb.org/full.json -o full.json
          # platform triple full.json-target full.json-arch
          targets="macos-arm64 aarch64-apple-darwin macos arm64
          macos-x64 x86_64-apple-darwin macos x86_64
          linux-x64 x86_64-unknown-linux-gnu ubuntu2204 x86_64
          linux-arm64 aarch64-unknown-linux-gnu ubuntu2204 aarch64
          windows-x64 x86_64-pc-windows-msvc windows x86_64"
          for v in $(scripts/plan.sh mongodb all | jq -r '.[]'); do
            rm -rf dist && mkdir dist
            while read -r platform triple target arch; do
              jq -e --arg p "$platform" '.mongodb.platforms | index($p)' versions.json >/dev/null || continue
              read -r url sha < <(jq -r --arg v "$v" --arg t "$target" --arg a "$arch" \
                '.versions[] | select(.version == $v) | .downloads[]
                 | select(.target == $t and .arch == $a and (.edition == "base" or .edition == "targeted"))
                 | "\(.archive.url) \(.archive.sha256)"' full.json | head -1) || true
              [ -n "${url:-}" ] || { echo "::error::no $target/$arch download for $v"; exit 1; }
              name="mongodb-$v-$triple"
              rm -rf x && mkdir x && curl -fsSL "$url" -o "x/${url##*/}"
              echo "$sha  x/${url##*/}" | sha256sum -c -
              case "$url" in
                *.zip) (cd x && unzip -q "${url##*/}") ;;
                *) tar xzf "x/${url##*/}" -C x ;;
              esac
              rm "x/${url##*/}" && mv x/* "x/$name"
              tar czf "dist/$name.tar.gz" -C x "$name"
              (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
              # Smoke test the build this runner can execute.
              if [ "$platform" = linux-x64 ]; then "x/$name/bin/mongod" --version; fi
            done <<<"$targets"
            tag="mongodb-$v"
            gh release view "$tag" >/dev/null 2>&1 ||
              gh release create "$tag" --prerelease --latest=false --title "MongoDB $v (official build)" \
                --notes "MongoDB Community Server $v, mirrored from fastdl.mongodb.org (checksums verified against MongoDB's full.json). Linux is the Ubuntu 22.04 build. SSPL; source at https://github.com/byreapp/mongo. Not used by Byre yet."
            gh release upload "$tag" dist/* --clobber
          done
