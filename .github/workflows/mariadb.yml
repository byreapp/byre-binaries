# Builds MariaDB from the official source tarball (archive.mariadb.org) and
# publishes each version as a PRERELEASE tagged mariadb-<version>, assets
# mariadb-<version>-<triple>.tar.gz + .sha256. ~1 h per platform. TLS is
# system OpenSSL on macOS/Linux, bundled WolfSSL on Windows. Not used by Byre yet.
#
# Tarball layout: mariadb-<version>-<triple>/{bin,lib,share,scripts,…} (cmake
# install), relocatable the same way as MySQL (see scripts/relocate-*.sh).
#
# Run: Actions → MariaDB → Run workflow. "all" builds every version not fully
# published yet; a version rebuilds that one (assets are replaced).
name: MariaDB

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in versions.json (e.g. 11.8.9), or "all"
        default: all

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.p.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: echo "versions=$(scripts/plan.sh mariadb "$VERSION")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
        target:
          - { os: macos-latest, platform: macos-arm64, triple: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: macos-x64, triple: x86_64-apple-darwin }
          - { os: ubuntu-22.04, platform: linux-x64, triple: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, platform: linux-arm64, triple: aarch64-unknown-linux-gnu }
          - { os: windows-latest, platform: windows-x64, triple: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 360
    env:
      NAME: mariadb-${{ matrix.version }}-${{ matrix.target.triple }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          # The build tree needs ~15 GB; the image ships far less free.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -q && sudo apt-get install -yq libssl-dev libncurses-dev bison ninja-build pkg-config patchelf
      - name: macOS deps
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 ninja bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH" # Apple's bison 2.3 is too old
      # MSVC dev env (vcvars64) for later steps; replaces ilammy/msvc-dev-cmd,
      # which still runs on Node 20.
      - name: MSVC env
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          set >> "%GITHUB_ENV%"
      - name: Windows deps
        if: runner.os == 'Windows'
        run: |
          python -m pip install -q ninja
          choco install winflexbison3 -y --no-progress
      - name: Build
        run: scripts/build-mariadb.sh "${{ matrix.version }}" "out/$NAME"
      - name: Package
        run: mkdir -p dist && tar czf "dist/$NAME.tar.gz" -C out "$NAME"
      - name: Smoke test
        run: scripts/test-mariadb.sh "dist/$NAME.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: dist/*.tar.gz

  publish:
    needs: [plan, build]
    # Publish whatever built: one platform failing shouldn't hold back the rest
    # (a later "all" run retries the missing ones).
    if: always() && needs.plan.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: mariadb-${{ matrix.version }}-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish.sh mariadb "${{ matrix.version }}"
